---
# Every machine Ansible knows about, and which role each one plays. The
# "k3s_server" group becomes each region's control plane node - the one
# running the Kubernetes API server. The "k3s_agent" group becomes each
# region's worker node, joining the server in its own region only. Nothing
# ever joins across regions - that would defeat the point of having two
# independent, region-isolated clusters.
all:
  vars:
    ansible_user: azureuser
    # This project generated a dedicated RSA key for Azure specifically
    # (see README) - pointing at it explicitly here, rather than relying on
    # Ansible's default key lookup, since the default SSH key on this
    # machine is a different, unrelated one.
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_azure
    # These machines were only just created, so this machine has never seen
    # their SSH host keys before. Skipping the interactive "do you trust
    # this host?" prompt is safe here specifically because trust was already
    # established a different way - Terraform (running as our own identity)
    # is what created these exact machines, so there's no unknown third
    # party to be suspicious of.
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:
    k3s_server:
      hosts:
        west-eu-server:
          ansible_host: 52.236.138.44
        germany-west-server:
          ansible_host: 20.52.138.69
        # The GCP showcase - a single node, in the k3s_server group and
        # nowhere else, deliberately. K3s doesn't block its own server node
        # from also running ordinary workloads the way full Kubernetes
        # taints a control-plane node by default - so one server, alone, is
        # already a complete, working cluster. No k3s_agent entry needed
        # here at all, unlike the two Azure regions.
        gcp-showcase:
          ansible_host: 136.115.185.153
          # Discovered live: this node's disk (standard/HDD - the only
          # option the Always Free tier actually covers, see README) is
          # slow enough that K3s's own internal database queries were
          # taking 8-60+ seconds, timing out even K3s's own components
          # talking to themselves. Traefik and ServiceLB are both switched
          # off - this showcase never runs an app that needs an ingress
          # controller or a LoadBalancer Service, so neither one is doing
          # anything here except adding to the disk-write load the slow
          # storage is already struggling with.
          k3s_server_extra_args: "--disable traefik --disable servicelb"

    k3s_agent:
      hosts:
        west-eu-agent:
          # Replaced once already by automatic_instance_repair before that
          # feature was disabled - this is the current, real address, not
          # the one originally assigned when the VM was first created.
          ansible_host: 20.107.2.72
          k3s_server_host: west-eu-server
        germany-west-agent:
          ansible_host: 20.113.169.250
          k3s_server_host: germany-west-server

    # Requirement 5's traffic router - the same GCP showcase VM, since it's
    # the one machine in this whole project genuinely outside both Azure
    # regions and not dependent on any laptop staying on. This group is
    # separate from k3s_server on purpose, even though it's the same
    # physical host: the proxy role installs a plain systemd service, not
    # a Kubernetes workload, and keeping the groups distinct keeps that
    # independence obvious from the inventory alone, not just from memory.
    proxy_servers:
      hosts:
        gcp-showcase:
          ansible_host: 136.115.185.153
          primary_backend: 20.229.108.8
          backup_backend: 20.218.111.44
