# Unlike Hello World, there's only one of these - Uptime Kuma runs once,
# on West Europe, and watches both regions' real public endpoints from
# that single vantage point. It doesn't need its own per-region overlay
# the way Hello World does, since it isn't itself part of the
# multi-region story - it's the thing observing it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dennis4507/cloud-native-ha-platform.git
    targetRevision: main
    path: k8s/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
