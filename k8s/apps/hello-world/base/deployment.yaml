# The actual "Hello World" workload - Requirement 2. No custom container
# image is built for this: it's plain NGINX, serving a single HTML file
# that gets mounted in from a ConfigMap instead of being baked into an
# image. That ConfigMap isn't defined here in the base - each region's
# overlay (west-eu, germany-west) supplies its own, under the same name, so
# the only thing that differs per region is the page's content, not the
# Deployment itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello-world
spec:
  # Two replicas is the minimum that actually proves Requirement 3's claim -
  # "traffic distributed across multiple instances." The HPA (added in the
  # next step) can scale this up further under load, but it never scales
  # below this floor.
  replicas: 2
  # The default rolling-update strategy tries to create a *new* pod before
  # removing an old one, so there's a brief moment with 3 pods wanting to
  # exist at once. With only 2 nodes and the required anti-affinity rule
  # below, there's no third node slot for that surge pod to ever land on -
  # it deadlocks in Pending forever, not just temporarily slow. Setting
  # maxSurge to 0 tells Kubernetes to free a node first (delete an old pod)
  # before scheduling the replacement, which fits a 2-node region's real
  # capacity instead of assuming spare room that doesn't exist here.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      # Started as "required" (a hard rule: never two hello-world pods on one
      # node). That's the strongest possible HA guarantee, but it collided
      # with reality live: this region only has 2 nodes, and the HPA's own
      # maxReplicas of 10 meant any scale-up past 2 pods had nowhere to go -
      # the 3rd pod deadlocked in Pending forever, confirmed via `kubectl
      # describe pod` showing "0/2 nodes are available: 2 node(s) didn't
      # match pod anti-affinity rules." Switched to "preferred": the
      # scheduler still tries hard to spread pods across separate nodes
      # first (weight: 100 is the maximum preference), but will stack extra
      # pods onto an already-used node rather than leave them permanently
      # unschedulable once every node has one. The baseline 2-replica case -
      # what actually proves Requirement 3's "distributed across multiple
      # nodes" claim - is unaffected either way; this only changes what
      # happens once the HPA tries to grow past node count.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hello-world
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            # The HPA added next scales based on CPU usage as a percentage of
            # this *request*, not of the node's total CPU. Set this too low
            # and the HPA fires constantly on ordinary noise; set it
            # realistically for what NGINX actually needs at idle, and the
            # scaling behavior during the load test actually means something.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              # subPath replaces just this one file, not the whole
              # /etc/nginx/conf.d/ directory - the stock nginx:alpine image
              # only ships one file there anyway, but subPath is the
              # explicit, safe way to say "swap this file," not "wipe this
              # directory and replace it with only what I listed."
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: html
          configMap:
            # Deliberately just a name reference, not defined in this file -
            # each region's overlay provides the actual ConfigMap, matching
            # this exact name, with that region's own identity text inside it.
            name: hello-world-html
        - name: nginx-conf
          configMap:
            # Same in every region - this is what adds the X-Pod-Name
            # response header used for Requirement 3's round-robin proof.
            # See nginx-config.yaml for why it exists.
            name: hello-world-nginx-conf
