# Uptime Kuma - a small, self-hosted dashboard that pings HTTP(S) endpoints
# on a schedule and shows their status live, red or green. This is what
# turns Requirement 6 ("describe how you'd assess availability") into
# something the panel actually watches happen on screen, especially during
# the Requirement 5 failover demo - a monitor flipping from green to red
# and back is far more convincing than being told "trust me, it failed
# over."
#
# Just one replica: this tool is the thing doing the watching, not the
# thing being watched - it doesn't need the same high-availability
# treatment as Hello World itself. If this one pod goes down, monitoring
# pauses, but the actual application it's watching is entirely unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
