# A ClusterIP Service - reachable from inside the cluster only. Same
# reasoning as not giving ArgoCD a public Ingress: this is an admin tool,
# not the application being demonstrated, so it's reached through
# `kubectl port-forward` when actually needed rather than exposed to the
# public internet on a project this temporary.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
